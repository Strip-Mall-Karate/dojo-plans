version: '2'
services:
  rabbitmq1:
    image: karate/rabbitmq
    command: start karate/rabbitmq --topology leader -I
  rabbitmq2:
    image: karate/rabbitmq
    links:
      - rabbitmq1
    command: start karate/rabbitmq --topology leader --peer rabbitmq1
  rabbitmq3:
    image: karate/rabbitmq
    links:
      - rabbitmq1
    command: start karate/rabbitmq --topology leader --peer rabbitmq1

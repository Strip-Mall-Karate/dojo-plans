version: '2'
services:
  rabbitmq:
    image: karate/rabbitmq
    environment:
      - DOJ_RABBITMQ=rabbitmq={default_vhost='/sensu',default_user='sensu',default_pass='sensu',management={enabled=true}}
    ports:
      - "5672:5672"
      - "15672:15672"
  redis:
    image: karate/redis
    links:
      - rabbitmq
    environment:
      - DOJ_REDIS=protected-mode='no'
    ports:
      - "6379:6379"
    command: start karate/redis --peer rabbitmq
  sensu-server:
    image: $DOJ_ORIGIN/sensu
    links:
      - rabbitmq
      - redis
    environment:
      - DOJ_SENSU=log_level='debug'
    command: start $DOJ_ORIGIN/sensu --peer rabbitmq --bind rabbitmq:rabbitmq.default --bind redis:redis.default
  sensu-client:
    image: $DOJ_ORIGIN/sensu
    links:
      - rabbitmq
    environment:
      - DOJ_SENSU=mode='client'
    command: start $DOJ_ORIGIN/sensu --peer rabbitmq --bind rabbitmq:rabbitmq.default
